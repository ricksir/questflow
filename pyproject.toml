[project]
name = "questflow-studio"
version = "6.24.0"
requires-python = ">=3.11"
description = "Banco local de questões, OCR, Telegram e ciclo de estudos adaptativo."

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["data", ".venv", "markdown_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
exclude = ["data", ".venv"]

[tool.coverage.run]
branch = true
source = ["core"]
omit = ["core/markdown_worker.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
