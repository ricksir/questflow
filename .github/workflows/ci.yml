name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Validate repository hygiene
        run: python tools/repository_hygiene.py

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock

      - name: Prepare sanitized test data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force data | Out-Null
          Copy-Item tests/fixtures/ci/taxonomia_afrfb.json data/taxonomia_afrfb.json
          python -c "from core.trail_guides import ensure_registry; ensure_registry('data/trail_guides.json')"

      - name: Run Python tests
        run: python run_tests.py

  interfaces:
    name: Studio web and Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Temporary refresh Expo lock snapshot
        working-directory: mobile
        run: |
          npm install --package-lock-only --ignore-scripts             expo@~57.0.22             expo-application@~57.0.3             expo-camera@~57.0.5             expo-constants@~57.0.18             expo-crypto@~57.0.3             expo-dev-client@~57.0.19             expo-device@~57.0.2             expo-linking@~57.0.10             expo-network@~57.0.2             expo-notifications@~57.0.18             expo-router@~57.0.21             expo-secure-store@~57.0.4             expo-sqlite@~57.0.3
          git diff -- package.json package-lock.json

      - name: Install Mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Validate Expo dependency matrix
        working-directory: mobile
        run: npm run check:expo

      - name: Audit high-severity Mobile dependencies
        working-directory: mobile
        run: npm run audit:high

      - name: Type-check Mobile
        working-directory: mobile
        run: npm run typecheck

      - name: Test Mobile core
        working-directory: mobile
        run: npm run test:core

      - name: Type-check Studio web modules
        working-directory: web-src
        run: npm run typecheck
