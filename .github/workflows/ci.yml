name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Validate repository hygiene
        run: python tools/repository_hygiene.py

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock

      - name: Prepare sanitized test data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force data | Out-Null
          Copy-Item tests/fixtures/ci/taxonomia_afrfb.json data/taxonomia_afrfb.json
          python -c "from core.trail_guides import ensure_registry; ensure_registry('data/trail_guides.json')"

      - name: Run Python tests
        run: python run_tests.py

  interfaces:
    name: Studio web and Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Validate Expo dependency matrix
        working-directory: mobile
        run: npm run check:expo

      - name: Audit high-severity Mobile dependencies
        working-directory: mobile
        run: npm run audit:high

      - name: Type-check Mobile
        working-directory: mobile
        run: npm run typecheck

      - name: Test Mobile core
        working-directory: mobile
        run: npm run test:core

      - name: Type-check Studio web modules
        working-directory: web-src
        run: npm run typecheck

  browser-smoke:
    name: Browser visual smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Show Chrome version
        run: google-chrome --version

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium==4.47.0

      - name: Run browser visual smoke
        run: python tests/browser_visual_smoke.py

      - name: Upload visual smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-visual-smoke
          path: artifacts/browser-visual-smoke/
          if-no-files-found: warn
          retention-days: 14
