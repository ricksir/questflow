name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt

      - name: Run Python tests
        run: python run_tests.py

  interfaces:
    name: Studio web and Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Type-check Mobile
        working-directory: mobile
        run: npm run typecheck

      - name: Test Mobile core
        working-directory: mobile
        run: npm run test:core

      - name: Type-check Studio web modules
        working-directory: web-src
        run: npm run typecheck
